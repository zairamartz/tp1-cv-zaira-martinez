<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contacto | Zai Martínez</title>
        <link href="estilos.css" rel="stylesheet" type="text/css">
        <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    </head>

    <body class="pagina-contacto">
        <header>
            <a href="index.html" class="logo"> <img src="images/logo-header.svg" alt="Zaira" width="104" height="29"></a>

             <nav>
                <a href="sobre-mi.html">Sobre mí</a>
                <a href="proyectos.html">Proyectos</a>
                <a href="contacto.html" class="activo">Contacto</a>
            </nav>
        </header>

        <main class="contacto-main">
            <section class="contacto-video-box">
                <video autoplay muted loop playsinline class="video-contacto">
                    <source src="images/contacto/video-contacto.mp4" type="video/mp4">
                </video>
                <div class="contacto-texto-overlay">
                    <h2>¡Hablemos!</h2>
                    <p>Si te gustó lo que viste, hablemos y contame lo que estés buscando &lt;3</p>
                </div>
            </section>

            <section class="contacto-form-box">
                <h4>Escribime tu idea:</h4>
                <form id="formulario">
                    <div class="form-grid">
                        <div class="form-group">
                            <input type="text" id="nombre" placeholder="Nombre y Apellido *" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" id="telefono" placeholder="Teléfono *" required>
                        </div>
                        <div class="form-group">
                            <input type="email" id="email" placeholder="E-mail *" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="asunto" placeholder="Asunto *" required>
                        </div>
                        <div class="form-group full-width">
                            <textarea id="mensaje" placeholder="Escribe tu mensaje aquí *" rows="5" required></textarea>
                        </div>
                    </div>
                    <div class="form-footer">
                        <p class="campos-obligatorios">*Campos obligatorios</p>
                        <button type="submit" class="btn-enviar">ENVIAR</button>
                    </div>
                    <p class="mensaje-form" id="mensaje-form"></p>
                </form>
                
            </section>
        </main>

        <footer class="footer">
            <p class="copyright">Todos los derechos reservados. 2026 ©</p>
            <div class="social-links">
                <a href="https://www.instagram.com/zai.martz/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <img src="images/instagram.png" alt="Instagram" width="25" height="25">
                </a>
                <a href="https://www.linkedin.com/in/zaira-martz" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <img src="images/linkedin.png" alt="LinkedIn" width="25" height="25">
                </a>
                <a href="https://www.behance.net/zairamartnez1" target="_blank" rel="noopener noreferrer" aria-label="Behance">
                    <img src="images/behance.png" alt="Behance" width="25" height="25">
                </a>
            </div>
    </footer>

    <script> 
        const formulario = document.getElementById("formulario");
        const aviso = document.getElementById("mensaje-form");

        formulario.addEventListener("submit", (evento) => {
        evento.preventDefault();

        const nombre = document.getElementById("nombre").value;
        const telefono = document.getElementById("telefono").value;
        const email = document.getElementById("email").value;
        const asunto = document.getElementById("asunto").value;
        const mensaje = document.getElementById("mensaje").value;

        const cuerpo =
            mensaje + "\n\n" +
            "---\n" +
            "Nombre: " + nombre + "\n" +
            "Teléfono: " + telefono + "\n" +
            "E-mail: " + email;

        const enlace =
            "mailto:mailfalso123@gmail.com" +
            "?subject=" + encodeURIComponent(asunto) +
            "&body=" + encodeURIComponent(cuerpo);

        window.location.href = enlace;
  });
</script>
    </body>
 </html>
